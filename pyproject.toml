[tool.poetry]
name = "lexi_data_analysis"
version = "0.1.0"
description = "Data analysis for all LEXI binary data"
authors = ["Ramiz Qudsi <qudsiramiz@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pandas = "^2.0.3"
seaborn = "^0.12.2"
tabulate = "^0.9.0"
spacepy = "^0.7.0"
opencv-python = "^4.11.0.86"
moviepy = "^2.1.2"
plotly = "^6.0.1"
paramiko = "^3.5.1"
dash = "^3.1.1"
pylunar = "^0.10.0"
basemap = "^2.0.0"
kaleido = "0.2.1"
dtaidistance = "^2.3.13"
scikit-learn = "^1.7.1"
pyspedas = "^1.7.28"
matplotlib = "^3.10.8"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
